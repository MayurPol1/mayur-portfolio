<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Mayur Pol</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0a0d14;
      color: #e7ecf3;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .code { font-family: ui-monospace, Consolas, monospace; color: #a597ff; font-size: 0.9rem; letter-spacing: 0.08em; }
    h1 { margin: 12px 0 8px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.03em; }
    p { margin: 0 auto 28px; max-width: 420px; color: #9aa5b8; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 999px;
      background: #6d5dfc;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #7d6ffd; }
    a:focus-visible { outline: 2px solid #a597ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">HTTP 404 · NotFoundResult()</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
